<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <!-- Deep Ink Navy Background -->
  <rect width="1200" height="630" fill="#172637" />
  
  <!-- Subtle Editorial Frame Line -->
  <rect x="40" y="40" width="1120" height="550" stroke="#365E65" stroke-width="1.5" stroke-opacity="0.6" fill="none" rx="8" />

  <!-- Monogram Box -->
  <rect x="100" y="110" width="96" height="96" rx="16" fill="#F7F5F0" />
  <path d="M125 130 H136 V150 H160 V130 H171 V186 H160 V162 H136 V186 H125 Z" fill="#172637" />
  <circle cx="174" cy="130" r="5" fill="#B88C61" />

  <!-- Pre-title Kicker -->
  <text x="100" y="270" font-family="'Cormorant Garamond', Georgia, serif" font-size="28" font-weight="600" letter-spacing="0.2em" fill="#D2AE78">REEL GAME RESEARCH &amp; CULTURE ARCHIVE</text>

  <!-- Main Brand Title -->
  <text x="100" y="340" font-family="'Noto Serif KR', Georgia, serif" font-size="56" font-weight="700" fill="#F7F5F0">릴게임 홍박사 <tspan fill="#B88C61">|</tspan> 사이트 INFO</text>

  <!-- Subtitle Description -->
  <text x="100" y="410" font-family="'Pretendard Variable', -apple-system, sans-serif" font-size="24" fill="#DFE3E2">바다이야기 · 야마토 · 손오공 · 오션파라다이스 · 황금성 · 신천지 · 다빈치</text>
  <text x="100" y="450" font-family="'Pretendard Variable', -apple-system, sans-serif" font-size="20" fill="#68747D">1990~2000년대 오락실 문화, 메커니즘 분석 및 사행성 규제 법제도 전문 학술 아카이브</text>

